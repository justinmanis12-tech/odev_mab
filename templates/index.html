<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="School Web Developers">
<meta name="generator" content="Odev Panosu Custom Build">
<title>Ödev Panosu — sınıflara göre ödevler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0c1a37;
    --paper: #eef2f7;
    --card: #ffffff;
    --line: #b8bfcb;
    --muted: #465e91;
    --marker: #c2921a;
    --teal: #0a917f;
    --danger: #b3261e;
    --font-display: "Unbounded", "Trebuchet MS", "Segoe UI", sans-serif;
    --font-body: "Manrope", "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.5;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--marker); outline-offset: 3px; }
  .teacher-mode :focus-visible { outline-color: var(--teal); }

  #app { min-height: 100vh; display: flex; flex-direction: column; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 18px clamp(16px, 4vw, 40px);
  }
  .brand { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -0.01em; }
  .link-btn {
    background: none; border: 0; padding: 8px 4px; cursor: pointer;
    text-decoration: underline; text-underline-offset: 4px; font-weight: 600;
  }
  .page { width: 100%; max-width: 860px; margin: 0 auto; padding: 8px clamp(16px, 4vw, 40px) 64px; }
  h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(26px, 5vw, 38px); line-height: 1.15; margin: 8px 0 8px; letter-spacing: -0.02em; }
  h2 { font-family: var(--font-display); font-weight: 500; font-size: 18px; margin: 36px 0 14px; }
  .lead { color: var(--muted); margin: 0 0 24px; max-width: 56ch; }

  .doors { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; }
  .door {
    border: 0; cursor: pointer; text-align: left;
    display: flex; flex-direction: column; justify-content: flex-end; gap: 12px;
    padding: clamp(24px, 6vw, 64px);
    transition: padding-bottom .2s ease;
  }
  .door:hover { padding-bottom: calc(clamp(24px, 6vw, 64px) + 14px); }
  .door .big { font-family: var(--font-display); font-weight: 700; font-size: clamp(34px, 6.5vw, 70px); line-height: 1.05; letter-spacing: -0.03em; }
  .door .small { font-size: 18px; max-width: 28ch; }
  .door-teacher { background: var(--ink); color: #fff; }
  .door-teacher .big { color: var(--marker); }
  .door-teacher:focus-visible { outline-offset: -8px; }
  .door-student { background: var(--teal); color: #fff; }
  .door-student:focus-visible { outline-color: #fff; outline-offset: -8px; }

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; max-width: 460px; }
  .field label { font-weight: 600; }
  input[type="text"], input[type="password"] {
    background: var(--card); border: 2px solid var(--line); border-radius: 10px;
    padding: 11px 14px; width: 100%;
  }
  input[type="text"]:focus, input[type="password"]:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 3px var(--marker); }

  .btn {
    background: var(--ink); color: #fff; border: 0; border-radius: 10px;
    padding: 12px 22px; font-weight: 600; cursor: pointer;
    text-decoration: none; display: inline-block; text-align: center;
  }
  .btn:hover:not(:disabled) { background: #22335c; }
  .btn:disabled { background: #9aa5bb; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--ink); border: 2px solid var(--ink); }
  .btn-ghost:hover:not(:disabled) { background: #e3e9f3; }
  .student-mode .btn:not(.btn-ghost) { background: var(--teal); }
  .student-mode .btn:not(.btn-ghost):hover { background: #0b5c51; }

  .drop {
    display: block; cursor: pointer; position: relative;
    border: 2px dashed var(--ink); border-radius: 14px; background: var(--card);
    padding: 28px 20px; text-align: center; margin-bottom: 18px;
  }
  .drop:hover { background: #fff6da; border-color: #8a6a00; }
  .drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .drop strong { display: block; font-size: 18px; }
  .drop span { color: var(--muted); }

  .task { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 14px; padding: 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .task .subj { font-weight: 700; font-size: 18px; word-break: break-all; }
  
  .empty { background: var(--card); border: 2px dashed var(--line); border-radius: 14px; padding: 28px 22px; color: var(--muted); }

  @media (max-width: 640px) {
    .doors { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .door { min-height: 38vh; }
    .task { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<div id="app">
  <div style="display:flex;flex-direction:column;flex:1">
    <div class="doors">
      <!-- Кнопка перехода для учителя -->
      <button class="door door-teacher" onclick="showTeacherPanel()">
        <span class="big">Öğretmen</span>
        <span class="small">Sınıfa ödev dosyası yükle</span>
      </button>
      <!-- Кнопка просмотра для учеников -->
      <button class="door door-student" onclick="showStudentPanel()">
        <span class="big">Öğrenci</span>
        <span class="small">Yüklenen ödevleri gör ve indir</span>
      </button>
    </div>
  </div>
</div>

<script>
function showTeacherPanel() {
  document.body.className = "teacher-mode";
  document.getElementById("app").innerHTML = `
    <div>
      <header class="topbar">
        <div class="brand">Ödev Panosu</div>
        <button class="link-btn" onclick="location.reload()">← Ana sayfa</button>
      </header>
      <main class="page">
        <h1>Ödev Yükle</h1>
        <p class="lead">Bilgisayarınızdan .txt ödev dosyasını seçin ve yükleyin.</p>
        
        <!-- Форма отправки на сервер Flask (/upload) -->
        <form action="/upload" method="post" enctype="multipart/form-data">
          <label class="drop">
            <input type="file" name="file" accept=".txt" required onchange="updateFileName(this)">
            <strong id="file-label-text">Bir .txt dosyası seçin veya tıklayın</strong>
            <span>Sunucuya yüklenecek</span>
          </label>
          <button class="btn" type="submit">Ödevi Sunucuya Yükle</button>
        </form>
      </main>
    </div>
  `;
}

function showStudentPanel() {
  document.body.className = "student-mode";
  
  // Передаем массив файлов, которые прилетели из Python в шаблон Jinja2
  const files = [
    {% for file in files %}
      "{{ file }}",
    {% endfor %}
  ];

  let filesHtml = "";
  if (files.length > 0) {
    files.forEach(file => {
      filesHtml += `
        <div class="task">
          <span class="subj">📄 ${file}</span>
          <a class="btn" href="/static/uploads/${file}" download>İndir (.txt)</a>
        </div>
      `;
    });
  } else {
    filesHtml = `<div class="empty">Henüz yüklenmiş ödev dosyası bulunmuyor.</div>`;
  }

  document.getElementById("app").innerHTML = `
    <div>
      <header class="topbar">
        <div class="brand">Ödev Panosu</div>
        <button class="link-btn" onclick="location.reload()">← Ana sayfa</button>
      </header>
      <main class="page">
        <h1>Mevcut Ödevler</h1>
        <p class="lead">Öğretmenin yüklediği dosyaları aşağıdan indirebilirsiniz:</p>
        <div style="margin-top: 20px;">
          ${filesHtml}
        </div>
      </main>
    </div>
  `;
}

function updateFileName(input) {
  if (input.files && input.files[0]) {
    document.getElementById("file-label-text").innerText = "Seçilen dosya: " + input.files[0].name;
  }
}
</script>

</body>
</html>
