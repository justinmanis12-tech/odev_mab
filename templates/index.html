<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="School Web Developers">
<meta name="generator" content="Odev Panosu Custom Build">
<title>Ödev Panosu — sınıflara göre ödevler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0c1a37;
    --paper: #eef2f7;
    --card: #ffffff;
    --line: #b8bfcb;
    --muted: #465e91;
    --marker: #c2921a;
    --teal: #0a917f;
    --danger: #b3261e;
    --font-display: "Unbounded", "Trebuchet MS", "Segoe UI", sans-serif;
    --font-body: "Manrope", "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.5;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--marker); outline-offset: 3px; }
  .teacher-mode :focus-visible { outline-color: var(--teal); }

  #app { min-height: 100vh; display: flex; flex-direction: column; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 18px clamp(16px, 4vw, 40px);
  }
  .brand { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -0.01em; }
  .link-btn {
    background: none; border: 0; padding: 8px 4px; cursor: pointer;
    text-decoration: underline; text-underline-offset: 4px; font-weight: 600;
  }
  .page { width: 100%; max-width: 860px; margin: 0 auto; padding: 8px clamp(16px, 4vw, 40px) 64px; }
  h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(26px, 5vw, 38px); line-height: 1.15; margin: 8px 0 8px; letter-spacing: -0.02em; }
  h2 { font-family: var(--font-display); font-weight: 500; font-size: 18px; margin: 36px 0 14px; }
  .lead { color: var(--muted); margin: 0 0 24px; max-width: 56ch; }

  .doors { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; }
  .door {
    border: 0; cursor: pointer; text-align: left;
    display: flex; flex-direction: column; justify-content: flex-end; gap: 12px;
    padding: clamp(24px, 6vw, 64px);
    transition: padding-bottom .2s ease;
  }
  .door:hover { padding-bottom: calc(clamp(24px, 6vw, 64px) + 14px); }
  .door .big { font-family: var(--font-display); font-weight: 700; font-size: clamp(34px, 6.5vw, 70px); line-height: 1.05; letter-spacing: -0.03em; }
  .door .small { font-size: 18px; max-width: 28ch; }
  .door-teacher { background: var(--ink); color: #fff; }
  .door-teacher .big { color: var(--marker); }
  .door-teacher:focus-visible { outline-offset: -8px; }
  .door-student { background: var(--teal); color: #fff; }
  .door-student:focus-visible { outline-color: #fff; outline-offset: -8px; }

  .grade { margin-bottom: 18px; }
  .grade-title { font-weight: 700; margin: 0 0 8px; color: var(--muted); font-size: 15px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip {
    background: var(--card); border: 2px solid var(--ink); border-radius: 10px;
    padding: 9px 16px; min-width: 60px; cursor: pointer; font-weight: 700;
  }
  .chip:hover { background: #e3e9f3; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--marker); }
  .student-mode .chip { border-color: var(--teal); }
  .student-mode .chip:hover { background: #dff0ed; }
  .student-mode .chip[aria-pressed="true"] { background: var(--teal); color: #fff; }
  .chip small { font-weight: 500; color: var(--muted); margin-left: 6px; }

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; max-width: 460px; }
  .field label { font-weight: 600; }
  input[type="text"], input[type="password"] {
    background: var(--card); border: 2px solid var(--line); border-radius: 10px;
    padding: 11px 14px; width: 100%;
  }
  input[type="text"]:focus, input[type="password"]:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 3px var(--marker); }

  .btn {
    background: var(--ink); color: #fff; border: 0; border-radius: 10px;
    padding: 12px 22px; font-weight: 600; cursor: pointer;
  }
  .btn:hover:not(:disabled) { background: #22335c; }
  .btn:disabled { background: #9aa5bb; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--ink); border: 2px solid var(--ink); }
  .btn-ghost:hover:not(:disabled) { background: #e3e9f3; }
  .btn-danger { background: transparent; color: var(--danger); border: 2px solid var(--danger); padding: 8px 14px; }
  .btn-danger:hover { background: #fbeae9; }
  .student-mode .btn:not(.btn-ghost):not(.btn-danger) { background: var(--teal); }
  .student-mode .btn:not(.btn-ghost):not(.btn-danger):hover { background: #0b5c51; }

  .inline-form { display: flex; gap: 10px; margin-top: 8px; max-width: 460px; }
  .inline-form input { flex: 1; }
  .error { color: var(--danger); font-weight: 600; margin: 0 0 14px; }

  .drop {
    display: block; cursor: pointer; position: relative;
    border: 2px dashed var(--ink); border-radius: 14px; background: var(--card);
    padding: 28px 20px; text-align: center; margin-bottom: 18px;
  }
  .drop:hover, .drop.over { background: #fff6da; border-color: #8a6a00; }
  .drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .drop:focus-within { outline: 3px solid var(--teal); outline-offset: 3px; }
  .drop strong { display: block; font-size: 18px; }
  .drop span { color: var(--muted); }

  pre.text {
    white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere;
    font-family: var(--font-body); font-size: 17px; line-height: 1.6;
    margin: 0; max-width: 72ch;
  }
  .preview { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 18px; }
  .preview .meta { color: var(--muted); font-size: 15px; margin-bottom: 8px; }
  
  .task { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 14px; overflow: hidden; }
  .task summary {
    list-style: none; cursor: pointer; padding: 16px 20px;
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px;
  }
  .task summary::-webkit-details-marker { display: none; }
  .task summary::before { content: "▸"; font-size: 14px; transition: transform .15s ease; }
  .task[open] summary::before { transform: rotate(90deg); }
  .task .subj { font-weight: 700; font-size: 18px; }
  .task .when { color: var(--muted); font-size: 15px; margin-left: auto; }
  .task .body { padding: 0 20px 18px 40px; }
  .task .actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .task .by { color: var(--muted); font-size: 15px; margin: 0 0 12px; }

  .empty { background: var(--card); border: 2px dashed var(--line); border-radius: 14px; padding: 28px 22px; color: var(--muted); }

  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 30px);
    background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 10px;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: 90vw; z-index: 10;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 640px) {
    .doors { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .door { min-height: 38vh; }
    .task .body { padding-left: 20px; }
    .task .when { margin-left: 0; width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
console.log("%cBu site iki arkadaş tarafından okul için özel olarak geliştirilmiştir! © 2026", "color: #0a917f; font-size: 16px; font-weight: bold;");

const MAX_FILE_KB = 300;

// Все данные хранятся на сервере (app.py), а не в браузере
let data = { classes: [], tasks: {} };

async function api(method, url, body) {
  const headers = { "Content-Type": "application/json" };
  if (state.teacherCode) headers["X-Teacher-Code"] = state.teacherCode;
  const res = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : undefined });
  let payload = null;
  try { payload = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error((payload && payload.error) || "Sunucu hatası (" + res.status + ")");
  return payload;
}
async function loadData() {
  try {
    const d = await api("GET", "/api/data");
    if (d && Array.isArray(d.classes) && d.tasks) data = d;
    return true;
  } catch (e) {
    toast("Sunucuya bağlanılamadı");
    return false;
  }
}
async function refresh() { if (await loadData()) render(); }

const state = {
  view: "home",
  cls: null,
  subject: "",
  file: null,
  teacherName: "",
  teacherCode: "",
};

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return el;
}
let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 3200);
}
function fmtDate(iso) {
  return new Date(iso).toLocaleString("tr-TR", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
}
function gradeOf(c) { const m = c.match(/^\s*(\d+)/); return m ? parseInt(m[1], 10) : 0; }
function shortName(c) { return c.replace(/^\s*\d+\s*[-–.]?\s*/, "") || c; }
function groupedClasses() {
  const g = new Map();
  data.classes.forEach(c => { const k = gradeOf(c); if (!g.has(k)) g.set(k, []); g.get(k).push(c); });
  return [...g.entries()].sort((a, b) => a[0] - b[0]);
}
function tasksOf(cls) {
  return (data.tasks[cls] || []).slice().sort((a, b) => b.date.localeCompare(a.date));
}
function go(view, extra) {
  Object.assign(state, { view, error: "" }, extra || {});
  render();
  window.scrollTo(0, 0);
  if (view !== "home" && view !== "teacherLogin") refresh();  // подтянуть свежие данные с сервера
}

async function readTxt(file) {
  const buf = await file.arrayBuffer();
  let text;
  try { text = new TextDecoder("utf-8", { fatal: true }).decode(buf); }
  catch (e) { text = new TextDecoder("windows-1254").decode(buf); }
  return text.replace(/^\uFEFF/, "");
}
async function pickFile(file) {
  if (!file) return;
  if (!/\.txt$/i.test(file.name)) { toast("Dosya uzantısı .txt olmalı"); return; }
  if (file.size > MAX_FILE_KB * 1024) { toast("Dosya " + MAX_FILE_KB + " KB'den büyük — ödevi kısaltın"); return; }
  try {
    const text = await readTxt(file);
    if (!text.trim()) { toast("Dosya boş"); return; }
    state.file = { name: file.name, size: file.size, text };
    render();
  } catch (e) { toast("Dosya okunamadı"); }
}
function downloadTxt(task) {
  const blob = new Blob([task.text], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = h("a", { href: url, download: task.fileName });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function topbar(backLabel, backAction) {
  return h("header", { class: "topbar" },
    h("div", { class: "brand" }, "Ödev Panosu"),
    backLabel && h("button", { class: "link-btn", onclick: backAction }, backLabel)
  );
}
function classChips(onPick) {
  const box = h("div", {});
  for (const [grade, list] of groupedClasses()) {
    const chips = h("div", { class: "chips", role: "group", "aria-label": grade ? grade + ". sınıf" : "Diğer" });
    for (const c of list) {
      const n = (data.tasks[c] || []).length;
      chips.append(h("button", {
        class: "chip", "aria-pressed": String(state.cls === c), "aria-label": c, onclick: () => onPick(c)
      }, grade ? shortName(c) : c, n > 0 ? h("small", {}, String(n)) : null));
    }
    box.append(h("div", { class: "grade" }, h("p", { class: "grade-title" }, grade ? grade + ". sınıf" : "Diğer"), chips));
  }
  return box;
}
function taskCard(task, opts) {
  const card = h("details", { class: "task", open: opts.open });
  card.append(h("summary", {},
    h("span", { class: "subj" }, task.subject || task.fileName),
    h("span", { class: "when" }, fmtDate(task.date))
  ));
  const body = h("div", { class: "body" });
  const by = [task.subject ? task.fileName : null, task.teacher ? "Öğretmen: " + task.teacher : null].filter(Boolean).join(" · ");
  if (by) body.append(h("p", { class: "by" }, by));
  body.append(h("pre", { class: "text" }, task.text));
  const actions = h("div", { class: "actions" },
    h("button", { class: "btn btn-ghost", onclick: () => downloadTxt(task) }, ".txt indir")
  );
  if (opts.deletable) {
    actions.append(h("button", { class: "btn btn-danger", onclick: async () => {
      if (!confirm("Bu ödev silinsin mi? (" + task.cls + ")")) return;
      try {
        await api("DELETE", "/api/tasks/" + encodeURIComponent(task.id));
        toast("Ödev silindi");
      } catch (e) { toast(e.message); }
      refresh();
    } }, "Sil"));
  }
  body.append(actions);
  card.append(body);
  return card;
}

function viewHome() {
  document.body.className = "";
  return h("div", { style: "display:flex;flex-direction:column;flex:1" },
    h("div", { class: "doors" },
      h("button", { class: "door door-teacher", onclick: () => go(state.teacherName ? "teacher" : "teacherLogin") },
        h("span", { class: "big" }, "Öğretmen"),
        h("span", { class: "small" }, "Sınıfa ödev dosyası yükle")
      ),
      h("button", { class: "door door-student", onclick: () => go("studentPick", { cls: null }) },
        h("span", { class: "big" }, "Öğrenci"),
        h("span", { class: "small" }, "Sınıfını seç ve ödevini gör")
      )
    )
  );
}

function viewTeacherLogin() {
  document.body.className = "teacher-mode";
  const nameIn = h("input", { type: "text", id: "tname", autocomplete: "name", value: state.teacherName, required: true });
  const codeIn = h("input", { type: "password", id: "tcode", autocomplete: "current-password", required: true });
  const form = h("form", { onsubmit: async (e) => {
    e.preventDefault();
    const code = codeIn.value;
    try {
      await api("POST", "/api/login", { code });
    } catch (err) {
      state.error = "Kod yanlış. Kodu site yöneticisinden öğrenin.";
      render();
      return;
    }
    state.teacherCode = code;
    go("teacher", { teacherName: nameIn.value.trim() });
  } },
    h("div", { class: "field" }, h("label", { for: "tname" }, "Adınız soyadınız"), nameIn),
    h("div", { class: "field" }, h("label", { for: "tcode" }, "Öğretmen kodu"), codeIn),
    state.error && h("p", { class: "error", role: "alert" }, state.error),
    h("button", { class: "btn", type: "submit" }, "Giriş yap")
  );
  const page = h("main", { class: "page" },
    h("h1", {}, "Öğretmen girişi"),
    h("p", { class: "lead" }, "Adınızı ve kodu yazın. Sonra sınıfı seçip ödevi yükleyebilirsiniz."),
    form
  );
  setTimeout(() => (state.teacherName ? codeIn : nameIn).focus(), 0);
  return h("div", {}, topbar("← Ana sayfa", () => go("home")), page);
}

function viewTeacher() {
  document.body.className = "teacher-mode";
  const logout = () => { state.teacherName = ""; state.teacherCode = ""; state.cls = null; state.file = null; state.subject = ""; go("home"); };
  const page = h("main", { class: "page" });
  page.append(
    h("h1", {}, "Ödev yükle"),
    h("p", { class: "lead" }, "Merhaba, " + state.teacherName + ". Önce sınıfı seçin, sonra ödevin olduğu .txt dosyasını ekleyin.")
  );

  page.append(h("h2", {}, "1. Sınıf"));
  page.append(classChips((c) => { state.cls = c; state.file = null; state.subject = ""; render(); }));

  const addIn = h("input", { type: "text", placeholder: "Yeni sınıf, örn. 10-E", "aria-label": "Yeni sınıfın adı", maxlength: "20" });
  page.append(h("form", { class: "inline-form", onsubmit: async (e) => {
    e.preventDefault();
    const name = addIn.value.trim();
    if (!name) return;
    if (data.classes.some(c => c.toLowerCase() === name.toLowerCase())) { toast("Bu sınıf zaten var"); return; }
    try {
      await api("POST", "/api/classes", { name });
      state.cls = name;
      toast("Sınıf eklendi: " + name);
      await refresh();
    } catch (err) { toast(err.message); }
  } }, addIn, h("button", { class: "btn btn-ghost", type: "submit" }, "Sınıf ekle")));

  if (!state.cls) return h("div", {}, topbar("Çıkış", logout), page);

  page.append(h("h2", {}, "2. Dosya: " + state.cls));
  const subjIn = h("input", { type: "text", id: "subj", value: state.subject, placeholder: "Örn. Matematik", maxlength: "60",
    oninput: (e) => { state.subject = e.target.value; } });
  page.append(h("div", { class: "field" }, h("label", { for: "subj" }, "Ders (isteğe bağlı)"), subjIn));

  const fileIn = h("input", { type: "file", accept: ".txt,text/plain", onchange: (e) => pickFile(e.target.files[0]) });
  const drop = h("label", { class: "drop" },
    fileIn,
    h("strong", {}, state.file ? "Başka dosya seç" : "Bir .txt dosyası seçin veya buraya sürükleyin"),
    h("span", {}, "En fazla " + MAX_FILE_KB + " KB")
  );
  ["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", (e) => pickFile(e.dataTransfer.files[0]));
  page.append(drop);

  if (state.file) {
    const shown = state.file.text.length > 700 ? state.file.text.slice(0, 700) + "…" : state.file.text;
    page.append(h("div", { class: "preview" },
      h("div", { class: "meta" }, state.file.name + " · " + Math.max(1, Math.round(state.file.size / 1024)) + " KB"),
      h("pre", { class: "text" }, shown)
    ));
  }

  page.append(h("button", { class: "btn", disabled: !state.file, onclick: async (e) => {
    const btn = e.currentTarget;
    btn.disabled = true;
    const c = state.cls;
    try {
      await api("POST", "/api/tasks", {
        cls: c,
        subject: state.subject.trim(),
        teacher: state.teacherName,
        fileName: state.file.name,
        text: state.file.text
      });
    } catch (err) {
      toast("Yüklenemedi: " + err.message);
      btn.disabled = false;
      return;
    }
    state.file = null; state.subject = "";
    toast("Ödev yüklendi: " + c);
    refresh();
  } }, "Yükle: " + state.cls));

  const list = tasksOf(state.cls);
  page.append(h("h2", {}, "Yüklenen ödevler: " + state.cls + (list.length ? " (" + list.length + ")" : "")));
  if (!list.length) page.append(h("div", { class: "empty" }, "Henüz ödev yok. İlk ödev yüklendiğinde burada görünecek."));
  list.forEach(t => page.append(taskCard(t, { open: false, deletable: true })));

  return h("div", {}, topbar("Çıkış", logout), page);
}

function viewStudentPick() {
  document.body.className = "student-mode";
  const page = h("main", { class: "page" },
    h("h1", {}, "Sınıfını seç"),
    h("p", { class: "lead" }, "Sınıfın yanındaki sayı, o sınıfta kaç ödev olduğunu gösterir."),
    classChips((c) => go("student", { cls: c }))
  );
  return h("div", {}, topbar("← Ana sayfa", () => go("home")), page);
}

function viewStudent() {
  document.body.className = "student-mode";
  const list = tasksOf(state.cls);
  const page = h("main", { class: "page" },
    h("h1", {}, state.cls),
    h("p", { class: "lead" }, list.length ? list.length + " ödev. Yenisi en üstte." : "Ödevler")
  );
  if (!list.length) page.append(h("div", { class: "empty" }, state.cls + " için henüz ödev yüklenmedi. Daha sonra tekrar bakın."));
  list.forEach((t, i) => page.append(taskCard(t, { open: i === 0, deletable: false })));
  return h("div", {}, topbar("← Başka sınıf", () => go("studentPick", { cls: null })), page);
}

function render() {
  const app = document.getElementById("app");
  const views = { home: viewHome, teacherLogin: viewTeacherLogin, teacher: viewTeacher, studentPick: viewStudentPick, student: viewStudent };
  app.replaceChildren(views[state.view]());
}
render();
refresh();
</script>
</body>
</html>
