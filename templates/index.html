<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="School Web Developers">
<meta name="generator" content="Odev Panosu Custom Build">
<title>Ödev Panosu — sınıflara göre ödevler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0c1a37;
    --paper: #eef2f7;
    --card: #ffffff;
    --line: #b8bfcb;
    --muted: #465e91;
    --marker: #c2921a;
    --teal: #0a917f;
    --danger: #b3261e;
    --font-display: "Unbounded", "Trebuchet MS", "Segoe UI", sans-serif;
    --font-body: "Manrope", "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.5;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--marker); outline-offset: 3px; }
  .teacher-mode :focus-visible { outline-color: var(--teal); }

  #app { min-height: 100vh; display: flex; flex-direction: column; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 18px clamp(16px, 4vw, 40px);
  }
  .brand { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -0.01em; }
  .link-btn {
    background: none; border: 0; padding: 8px 4px; cursor: pointer;
    text-decoration: underline; text-underline-offset: 4px; font-weight: 600;
  }
  .page { width: 100%; max-width: 860px; margin: 0 auto; padding: 8px clamp(16px, 4vw, 40px) 64px; }
  h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(26px, 5vw, 38px); line-height: 1.15; margin: 8px 0 8px; letter-spacing: -0.02em; }
  h2 { font-family: var(--font-display); font-weight: 500; font-size: 18px; margin: 36px 0 14px; }
  .lead { color: var(--muted); margin: 0 0 24px; max-width: 56ch; }

  .doors { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; }
  .door {
    border: 0; cursor: pointer; text-align: left;
    display: flex; flex-direction: column; justify-content: flex-end; gap: 12px;
    padding: clamp(24px, 6vw, 64px);
    transition: padding-bottom .2s ease;
  }
  .door:hover { padding-bottom: calc(clamp(24px, 6vw, 64px) + 14px); }
  .door .big { font-family: var(--font-display); font-weight: 700; font-size: clamp(34px, 6.5vw, 70px); line-height: 1.05; letter-spacing: -0.03em; }
  .door .small { font-size: 18px; max-width: 28ch; }
  .door-teacher { background: var(--ink); color: #fff; }
  .door-teacher .big { color: var(--marker); }
  .door-teacher:focus-visible { outline-offset: -8px; }
  .door-student { background: var(--teal); color: #fff; }
  .door-student:focus-visible { outline-color: #fff; outline-offset: -8px; }

  .grade { margin-bottom: 18px; }
  .grade-title { font-weight: 700; margin: 0 0 8px; color: var(--muted); font-size: 15px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip {
    background: var(--card); border: 2px solid var(--ink); border-radius: 10px;
    padding: 9px 16px; min-width: 60px; cursor: pointer; font-weight: 700;
  }
  .chip:hover { background: #e3e9f3; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--marker); }
  .student-mode .chip { border-color: var(--teal); }
  .student-mode .chip:hover { background: #dff0ed; }
  .student-mode .chip[aria-pressed="true"] { background: var(--teal); color: #fff; }

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; max-width: 460px; }
  .field label { font-weight: 600; }
  input[type="text"], input[type="password"] {
    background: var(--card); border: 2px solid var(--line); border-radius: 10px;
    padding: 11px 14px; width: 100%;
  }
  input[type="text"]:focus, input[type="password"]:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 3px var(--marker); }

  .btn {
    background: var(--ink); color: #fff; border: 0; border-radius: 10px;
    padding: 12px 22px; font-weight: 600; cursor: pointer;
    text-decoration: none; display: inline-block; text-align: center;
  }
  .btn:hover:not(:disabled) { background: #22335c; }
  .btn:disabled { background: #9aa5bb; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--ink); border: 2px solid var(--ink); }
  .btn-ghost:hover:not(:disabled) { background: #e3e9f3; }
  .student-mode .btn:not(.btn-ghost) { background: var(--teal); }
  .student-mode .btn:not(.btn-ghost):hover { background: #0b5c51; }

  .drop {
    display: block; cursor: pointer; position: relative;
    border: 2px dashed var(--ink); border-radius: 14px; background: var(--card);
    padding: 28px 20px; text-align: center; margin-bottom: 18px;
  }
  .drop:hover { background: #fff6da; border-color: #8a6a00; }
  .drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .drop strong { display: block; font-size: 18px; }
  .drop span { color: var(--muted); }

  .task { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 14px; padding: 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .task .subj { font-weight: 700; font-size: 18px; word-break: break-all; }
  .empty { background: var(--card); border: 2px dashed var(--line); border-radius: 14px; padding: 28px 22px; color: var(--muted); }

  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 30px);
    background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 10px;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 10;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script>
const TEACHER_CODE = "ogretmen";
const GRADES = [9, 10, 11, 12];
const SECTIONS = ["ATP", "A", "B", "C", "D", "Özel Sınıf"];
const DEFAULT_CLASSES = GRADES.flatMap(g => SECTIONS.map(s => g + "-" + s));

const state = {
  view: "home",
  cls: null,
  teacherName: "",
  error: ""
};

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 3000);
}

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return el;
}

function topbar(backLabel, backAction) {
  return h("header", { class: "topbar" },
    h("div", { class: "brand" }, "Ödev Panosu"),
    backLabel && h("button", { class: "link-btn", onclick: backAction }, backLabel)
  );
}

function classChips(selectedCls, onPick) {
  const box = h("div", {});
  const grouped = new Map();
  DEFAULT_CLASSES.forEach(c => {
    const g = c.split("-")[0];
    if (!grouped.has(g)) grouped.set(g, []);
    grouped.get(g).push(c);
  });

  for (const [grade, list] of grouped.entries()) {
    const chips = h("div", { class: "chips" });
    for (const c of list) {
      chips.append(h("button", {
        class: "chip",
        "aria-pressed": String(selectedCls === c),
        onclick: () => onPick(c)
      }, c.replace(grade + "-", "")));
    }
    box.append(h("div", { class: "grade" }, h("p", { class: "grade-title" }, grade + ". Sınıf"), chips));
  }
  return box;
}

function viewHome() {
  document.body.className = "";
  return h("div", { style: "display:flex;flex-direction:column;flex:1" },
    h("div", { class: "doors" },
      h("button", { class: "door door-teacher", onclick: () => go(state.teacherName ? "teacher" : "teacherLogin") },
        h("span", { class: "big" }, "Öğretmen"),
        h("span", { class: "small" }, "Sınıfa ödev dosyası yükle")
      ),
      h("button", { class: "door door-student", onclick: () => go("studentPick") },
        h("span", { class: "big" }, "Öğrenci"),
        h("span", { class: "small" }, "Sınıfını seç ve ödevini gör")
      )
    )
  );
}

function viewTeacherLogin() {
  document.body.className = "teacher-mode";
  const nameIn = h("input", { type: "text", id: "tname", value: state.teacherName, required: true });
  const codeIn = h("input", { type: "password", id: "tcode", required: true });
  
  const form = h("form", { onsubmit: (e) => {
    e.preventDefault();
    if (codeIn.value !== TEACHER_CODE) {
      state.error = "Kod yanlış! (Şifre: ogretmen)";
      render();
      return;
    }
    state.teacherName = nameIn.value.trim();
    go("teacher");
  }},
    h("div", { class: "field" }, h("label", {}, "Adınız Soyadınız"), nameIn),
    h("div", { class: "field" }, h("label", {}, "Öğretmen Kodu"), codeIn),
    state.error && h("p", { class: "error", style: "color:var(--danger)" }, state.error),
    h("button", { class: "btn", type: "submit" }, "Giriş Yap")
  );

  return h("div", {}, topbar("← Ana sayfa", () => go("home")),
    h("main", { class: "page" },
      h("h1", {}, "Öğretmen Girişi"),
      h("p", { class: "lead" }, "Lütfen adınızı ve şifrenizi girin."),
      form
    )
  );
}
  
function viewTeacher() {
  document.body.className = "teacher-mode";
  const page = h("main", { class: "page" });
  
  page.append(
    h("h1", {}, "Ödev Yükleme Paneli"),
    h("p", { class: "lead" }, `Hoş geldiniz, ${state.teacherName}. Önce sınıf seçin, ardından dosya yükleyin.`)
  );

  page.append(h("h2", {}, "1. Sınıf Seçin"));
  page.append(classChips(state.cls, (c) => { state.cls = c; render(); }));

  if (state.cls) {
    page.append(h("h2", {}, `2. Sınıf İçin Dosya Yükle: ${state.cls}`));
    
    const uploadForm = h("form", { action: "/upload", method: "post", enctype: "multipart/form-data" },
      h("input", { type: "hidden", name: "class_name", value: state.cls }),
      h("label", { class: "drop" },
        h("input", { type: "file", name: "file", accept: ".txt", required: true, onchange: (e) => {
          if(e.target.files[0]) e.target.closest('label').querySelector('strong').textContent = "Seçilen: " + e.target.files[0].name;
        }}),
        h("strong", {}, "Bir .txt dosyası seçin veya buraya sürükleyin"),
        h("span", {}, "Maksimum dosya boyutu: .txt formatı")
      ),
      h("button", { class: "btn", type: "submit" }, `Ödevi (${state.cls}) Yükle`)
    );
    page.append(uploadForm);
  }

  return h("div", {}, topbar("Çıkış", () => { state.cls = null; go("home"); }), page);
}

function viewStudentPick() {
  document.body.className = "student-mode";
  const page = h("main", { class: "page" },
    h("h1", {}, "Sınıfınızı Seçin"),
    h("p", { class: "lead" }, "Ödevleri görmek için kendi sınıfınızı seçin."),
    classChips(null, (c) => { state.cls = c; go("student"); })
  );
  return h("div", {}, topbar("← Ana sayfa", () => go("home")), page);
}

function viewStudent() {
  document.body.className = "student-mode";
  const page = h("main", { class: "page" });
  page.append(
    h("h1", {}, `${state.cls} Ödevleri`),
    h("p", { class: "lead" }, "Bu sınıfa yüklenen ödev dosyaları:")
  );

  const serverFiles = [
    {% for file in files %}
      { name: "{{ file.name }}", cls: "{{ file.cls }}" },
    {% endfor %>
  ];

  const filteredFiles = serverFiles.filter(f => f.cls === state.cls);

  if (filteredFiles.length > 0) {
    const listContainer = h("div", { style: "margin-top: 20px;" });
    filteredFiles.forEach(f => {
      listContainer.append(
        h("div", { class: "task" },
          h("span", { class: "subj" }, `📄 ${f.name}`),
          h("a", { class: "btn", href: `/static/uploads/${f.name}`, download: true }, "İndir (.txt)")
        )
      );
    });
    page.append(listContainer);
  } else {
    page.append(h("div", { class: "empty" }, `${state.cls} için henüz ödev yüklenmemiş.`));
  }

  return h("div", {}, topbar("← Sınıf değişt습", () => go("studentPick")), page);
}

function go(view) {
  state.view = view;
  render();
  window.scrollTo(0, 0);
}

function render() {
  const app = document.getElementById("app");
  const views = {
    home: viewHome,
    teacherLogin: viewTeacherLogin,
    teacher: viewTeacher,
    studentPick: viewStudentPick,
    student: viewStudent
  };
  app.replaceChildren(views[state.view]());
}

render();
</script>
</body>
</html>
